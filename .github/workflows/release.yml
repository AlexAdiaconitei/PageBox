name: Release

# Publishes the image to GHCR. A tag is the trigger, so a version in the registry can only
# ever be a version that exists in the history:
#
#   git tag v0.1.0 && git push origin v0.1.0
#     -> ghcr.io/alexadiaconitei/pagebox:0.1.0, :0.1, :latest
#
# workflow_dispatch rebuilds the same tags without moving the git tag, for when a base image
# picks up a security fix and nothing in the source changed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to rebuild (e.g. v0.1.0)'
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Computed here rather than with metadata-action: three tags off one version string is
      # less code than configuring a matcher for it, and it fails loudly on a tag that is not
      # a version instead of silently publishing something unexpected.
      - id: tags
        env:
          REF_NAME: ${{ inputs.ref || github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$REF_NAME' is not a vMAJOR.MINOR.PATCH tag"; exit 1 ;;
          esac
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pagebox"
          tags="${image}:${version}"
          # A pre-release is publishable, but it must not become what a plain `docker pull`
          # gets, and it must not claim the minor either.
          case "$version" in
            *-*) ;;
            *) tags="${tags},${image}:${version%.*},${image}:latest" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Publishing: $tags" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built once, loaded locally, and pushed only after it has answered a request. The
      # second step is a cache hit, not a rebuild.
      #
      # linux/amd64 only: the image builds the SvelteKit app inside itself, and doing that
      # for arm64 under emulation turns a two-minute release into a twenty-minute one. Add
      # `platforms:` to both steps when an arm64 host needs it.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pagebox:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image that is about to be published
        run: bash scripts/smoke-image.sh pagebox:smoke

      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          labels: |
            org.opencontainers.image.title=PageBox
            org.opencontainers.image.description=Self-hosted static hosting with a panel, a deploy API and private sites
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
