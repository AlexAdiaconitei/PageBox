name: Docs → PageBox

# Deploys the documentation site to a PageBox instance — the same workflow the docs tell
# everyone else to write, running against PageBox's own docs.
#
# Needs three secrets and one variable:
#   secrets.PAGEBOX_ADMIN   https://pagebox.example.com
#   secrets.PAGEBOX_TOKEN   the pbx_ deploy token issued for the site
#   vars.PAGEBOX_SLUG       the site's slug, e.g. docs
#
# It is manual and on-release rather than on every push: GitHub Pages is the canonical
# home, and this is the copy that proves the product hosts its own documentation.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: docs-pagebox
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gh-pages
    steps:
      # A release must not go red because nobody has stood an instance up yet. Until the
      # secrets exist this is a deliberate no-op with a line saying so, not a failure.
      - id: configured
        working-directory: .
        run: |
          if [ -n "${{ secrets.PAGEBOX_ADMIN }}" ] && [ -n "${{ secrets.PAGEBOX_TOKEN }}" ] && [ -n "${{ vars.PAGEBOX_SLUG }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No PageBox instance configured (secrets.PAGEBOX_ADMIN / secrets.PAGEBOX_TOKEN / vars.PAGEBOX_SLUG). Skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.configured.outputs.ready == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gh-pages/pnpm-lock.yaml

      # No --ignore-workspace: gh-pages/pnpm-workspace.yaml is this project's own
      # workspace root, and it carries the supply-chain policy exclusions. Ignoring
      # it discards those settings and the install fails the minimumReleaseAge check.
      - if: steps.configured.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.configured.outputs.ready == 'true'
        run: ./scripts/deploy-to-pagebox.sh
        env:
          PAGEBOX_ADMIN: ${{ secrets.PAGEBOX_ADMIN }}
          PAGEBOX_TOKEN: ${{ secrets.PAGEBOX_TOKEN }}
          PAGEBOX_SLUG: ${{ vars.PAGEBOX_SLUG }}
          DEPLOY_NOTES: ${{ github.sha }}
