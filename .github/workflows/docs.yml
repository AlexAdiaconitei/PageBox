name: Docs

# The documentation site lives in gh-pages/ and is its own pnpm project — it does not share
# the application's lockfile, and nothing here installs the app.
on:
  push:
    branches: [main]
    paths:
      - 'gh-pages/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'gh-pages/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gh-pages
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gh-pages/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --ignore-workspace

      - run: pnpm types:check

      # A GitHub Pages project site is served from /<repo>, so the build has to be told —
      # the same thing every site deployed to PageBox has to be told, for the same reason.
      - run: pnpm build
        env:
          DOCS_BASE_PATH: /${{ github.event.repository.name }}
          DOCS_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      # The check the docs tell everyone else to run. A reference that starts at the server
      # root would 404 under the base path, so it fails the build rather than shipping.
      - name: Check nothing escapes the base path
        run: |
          escaped=$(grep -rhoE '(src|href)="/[^"]*"' out --include='*.html' \
            | grep -vE '"/'"${GITHUB_REPOSITORY#*/}"'/' || true)
          if [ -n "$escaped" ]; then
            echo "::error::references outside the base path:"
            echo "$escaped" | sort -u | head -20
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: gh-pages/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
