# gh-pages is its own pnpm project: the docs site must build without the app's
# dependencies, and CI installs it on its own.
allowBuilds:
  esbuild: true
  unrs-resolver: true

overrides:
  js-yaml@4: 4.3.2
  fast-uri@3: 3.1.8
  brace-expansion@1: 1.1.21
  brace-expansion@>=4: 5.0.12

minimumReleaseAgeExclude:
  - '@fumadocs/base-ui@16.15.3'
  - fumadocs-core@16.15.3
  - fumadocs-mdx@15.4.0
