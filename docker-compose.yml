# Standalone profile: everything PageBox needs, on any Docker host.
#
#   docker compose up -d                          app + postgres + minio
#   docker compose --profile cache up -d          + valkey (shared grant cache)
#   docker compose --profile proxy up -d          + traefik routing both hostnames
#
# For Dokploy use docker-compose.dokploy.yml, or (recommended) the Application/Dockerfile
# deployment described in deploy/dokploy.md.

services:
  app:
    # The published image, so this file works in a directory that holds nothing but this
    # file and a .env. Override the tag with PAGEBOX_TAG=0.1.0 to pin, or swap the two
    # lines below for `build: { context: . }` to run the checkout instead of the release.
    image: ghcr.io/alexadiaconitei/pagebox:${PAGEBOX_TAG:-latest}
    pull_policy: always
    env_file: .env
    environment:
      DATABASE_URL: postgres://pagebox:${POSTGRES_PASSWORD:-pagebox}@postgres:5432/pagebox
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-pagebox}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-pageboxpagebox}
      S3_FORCE_PATH_STYLE: 'true'
    ports:
      - '${PAGEBOX_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    labels:
      # Only used with --profile proxy.
      - 'traefik.enable=true'
      - 'traefik.http.routers.pagebox-admin.rule=Host(`${PAGEBOX_ADMIN_HOST}`)'
      - 'traefik.http.routers.pagebox-admin.entrypoints=web'
      - 'traefik.http.routers.pagebox-sites.rule=Host(`${PAGEBOX_SITES_HOST}`)'
      - 'traefik.http.routers.pagebox-sites.entrypoints=web'
      - 'traefik.http.services.pagebox.loadbalancer.server.port=3000'

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pagebox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pagebox}
      POSTGRES_DB: pagebox
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published so `pnpm dev` and the seed script can reach it from the host.
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pagebox -d pagebox']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pagebox}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pageboxpagebox}
    volumes:
      - miniodata:/data
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    profiles: [cache]
    command: valkey-server --save 60 1 --appendonly no
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  traefik:
    image: traefik:v3.3
    profiles: [proxy]
    command:
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entrypoints.web.address=:80'
      # Traefik streams request bodies without a size limit unless a `buffering`
      # middleware says otherwise, so the upload cap lives in the app (MAX_UPLOAD_BYTES).
    ports:
      - '${TRAEFIK_PORT:-80}:80'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  valkeydata:
