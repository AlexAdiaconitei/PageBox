# For a Dokploy Compose stack, place this file in its Traefik dynamic directory.
# Replace the hostnames and container name. Application deployments also need a router
# covering site subdomains. These rules use Traefik v3 / Go regexp syntax.
# Production requires a TLS entrypoint and certificates for the central hosts and
# *.pages.example.com. Upgrade the application and routes together.

http:
  routers:
    pagebox-admin:
      rule: 'Host(`pagebox.example.com`)'
      entryPoints: [web]
      service: pagebox
    pagebox-sites:
      rule: 'Host(`pages.example.com`) || HostRegexp(`^[a-z0-9][a-z0-9-]{0,27}-[0-9a-hjkmnp-tv-z]{26}\Q.pages.example.com\E$`)'
      entryPoints: [web]
      service: pagebox

  services:
    pagebox:
      loadBalancer:
        servers:
          - url: 'http://pagebox-pagebox-1:3000'
