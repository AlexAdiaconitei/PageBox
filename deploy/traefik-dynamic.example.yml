# For a Dokploy Compose stack, place this file in its Traefik dynamic directory.
# Replace the hostnames and container name. These rules use Traefik v3 syntax.
# Production requires a TLS entrypoint and a certificate for every host listed here.
# Upgrade the application and routes together.

http:
  routers:
    pagebox-admin:
      rule: 'Host(`pagebox.example.com`)'
      entryPoints: [web]
      service: pagebox
    pagebox-sites:
      rule: 'Host(`pages.example.com`)'
      entryPoints: [web]
      service: pagebox
    # One router per custom domain set on a site in the panel. PageBox picks the site by
    # the Host header and serves it from `/`, so the request goes through unchanged: no
    # path prefix, no rewrite.
    # pagebox-docs:
    #   rule: 'Host(`docs.example.org`)'
    #   entryPoints: [web]
    #   service: pagebox

  services:
    pagebox:
      loadBalancer:
        servers:
          - url: 'http://pagebox-pagebox-1:3000'
